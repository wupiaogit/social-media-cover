<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>block cover</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; padding: 32px; }
  .poster {
    width: 1080px;
    height: 1440px;
    position: relative;
    overflow: hidden;
    background: #0e1116;
    font-family: "Noto Sans SC", "PingFang SC", sans-serif;
    color: #f4f1ea;
  }
  .rail {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 28px;
    background: #ff5a1f;
  }
  .top {
    position: absolute;
    left: 88px; right: 72px; top: 72px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 22px;
    letter-spacing: 0.06em;
    color: #9aa3b2;
  }
  .pill {
    border: 1.5px solid #ff5a1f;
    color: #ff5a1f;
    padding: 10px 18px;
    font-size: 20px;
    letter-spacing: 0.08em;
  }
  .main {
    position: absolute;
    left: 88px; right: 72px;
    top: 280px;
  }
  .kicker {
    font-size: 28px;
    font-weight: 700;
    color: #ff5a1f;
    margin-bottom: 28px;
    letter-spacing: 0.04em;
  }
  .title {
    font-size: 84px;
    font-weight: 900;
    line-height: 1.22;
    letter-spacing: -0.02em;
  }
  .title span.soft { color: #c8cdd6; font-weight: 700; }
  .card {
    position: absolute;
    left: 88px; right: 72px;
    bottom: 160px;
    background: #171c24;
    border-left: 8px solid #ff5a1f;
    padding: 40px 44px;
  }
  .card p {
    font-size: 34px;
    line-height: 1.55;
    font-weight: 500;
    color: #e8ebf0;
  }
  .foot {
    position: absolute;
    left: 88px; right: 72px;
    bottom: 72px;
    display: flex; justify-content: space-between;
    font-family: "IBM Plex Mono", monospace;
    font-size: 20px;
    color: #7b8494;
  }
</style>
</head>
<body>
  <section class="poster" id="cover">
    <div class="rail"></div>
    <div class="top">
      <span>PIAOGE · AI NOTES</span>
      <span class="pill">实测 01</span>
    </div>
    <div class="main">
      <div class="kicker">VS ChatGPT / Claude</div>
      <h1 class="title">Grok Bot<br>到底是啥？<br><span class="soft">手机一句话<br>云电脑自己干</span></h1>
    </div>
    <div class="card">
      <p>不是聊天框——背后是一台<br>24 小时不停机的云电脑。</p>
    </div>
    <div class="foot">
      <span>GROK BOT INTRO</span>
      <span>2026.09</span>
    </div>
  </section>
</body>
</html>
