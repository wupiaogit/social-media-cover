<h2>图 1 识别结果</h2>
<p>标题：<span class=k>三步搭建可检索的知识库</span></p>
<ul><li>第一步 统一入口，所有来源先进同一个收件箱</li>
<li>第二步 存的时候补齐字段，别留裸链接</li>
<li>第三步 音视频转文字，让全文可搜</li></ul>
<h2>图 2 识别结果</h2>
<p>标题：<span class=k>命名规则决定检索效率</span></p>
<ul><li>日期在前，主题在后，避免同名覆盖</li>
<li>分类用有限枚举，不要自由发挥</li>
<li>标签控制在三层以内</li></ul>
