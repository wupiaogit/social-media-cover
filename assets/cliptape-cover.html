<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Clipno · 小红书封面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&display=swap">
  <style>
    :root { --ink:#111114; --hl:#FFE45C; --grey:#6f6b64; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:#333; font-family: "Noto Sans SC","PingFang SC","Microsoft YaHei","Source Han Sans SC","Hiragino Sans GB",system-ui,sans-serif;
           -webkit-font-smoothing:antialiased; }
    .poster { position:relative; width:1080px; height:1440px; overflow:hidden;
      background:
        radial-gradient(ellipse 700px 480px at 88% 6%, rgba(255,228,92,.35), transparent 60%),
        radial-gradient(ellipse 800px 600px at 0% 80%, rgba(17,17,20,.05), transparent 60%),
        linear-gradient(170deg,#fcfbf9 0%,#f4f2ed 55%,#ece9e2 100%);
      color:var(--ink); }
    .content { position:relative; z-index:2; height:100%; display:flex;
      flex-direction:column; align-items:center; padding:54px 56px 36px; }

    /* 顶部胶囊 */
    .pills { display:flex; gap:20px; }
    .pill { display:flex; align-items:center; gap:12px; background:#fff;
      border:2.5px solid var(--ink); border-radius:999px; padding:13px 28px;
      font-size:30px; font-weight:700; color:var(--ink);
      box-shadow:0 8px 20px -10px rgba(17,17,20,.35); }
    .pill svg { width:34px; height:34px; }
    .pill.y { background:var(--hl); }

    /* 品牌行 */
    .brand { margin-top:38px; display:flex; align-items:center; gap:18px; }
    .brand img { width:84px; height:84px; border-radius:20px;
      box-shadow:0 10px 24px -10px rgba(17,17,20,.4); }
    .brand .name { font-weight:900; font-size:40px; }
    .brand .name small { display:block; font-size:24px; font-weight:700; color:var(--grey);
      letter-spacing:.14em; margin-top:2px; }

    /* 标题 */
    .title { margin-top:24px; text-align:center; font-weight:900;
      font-size:108px; line-height:1.2; }
    .title .mark { background:var(--hl); padding:0 16px; border-radius:14px;
      box-shadow:6px 6px 0 var(--ink); }
    .sub { margin-top:26px; font-size:38px; font-weight:700; color:#3a3730; }
    .sub b { border-bottom:6px solid var(--hl); }

    /* 双手机 mockup */
    .phones { position:relative; margin-top:34px; flex:1; width:100%;
      display:flex; justify-content:center; align-items:flex-start; }
    .phone { position:relative; background:#0e0e10; border-radius:52px; padding:13px;
      box-shadow:0 40px 80px -28px rgba(17,17,20,.5); }
    .phone .screen { position:relative; border-radius:40px; overflow:hidden;
      aspect-ratio:1170/2532; background:#fff; }
    .phone .screen img { width:100%; height:100%; object-fit:cover; display:block; }
    .phone .island { position:absolute; top:26px; left:50%; transform:translateX(-50%);
      width:94px; height:28px; border-radius:16px; background:#000; z-index:3; }
    .phone.main { width:314px; z-index:3; }
    .phone.back { width:264px; position:absolute; right:118px; top:36px;
      transform:rotate(6deg); z-index:1; filter:brightness(.96); }
    .phone.main { margin-right:190px; }

    /* 黑色气泡贴纸 */
    .bubble { position:absolute; left:60px; bottom:96px; z-index:5;
      background:var(--ink); color:#fff; border-radius:26px; padding:22px 30px;
      transform:rotate(-4deg); box-shadow:0 20px 44px -16px rgba(17,17,20,.5); }
    .bubble::after { content:''; position:absolute; right:46px; top:-16px;
      border-left:14px solid transparent; border-right:14px solid transparent;
      border-bottom:20px solid var(--ink); }
    .bubble .b1 { font-size:28px; font-weight:700; color:#d9d6cf; }
    .bubble .b2 { margin-top:8px; font-size:38px; font-weight:900; }
    .bubble .b2 em { font-style:normal; color:var(--hl); }

    /* 剪刀装饰 */
    .scissor { position:absolute; z-index:4; opacity:.9; }
    .scissor svg { display:block; }

    .foot { width:100%; display:flex; justify-content:space-between; align-items:center;
      margin-top:26px; }
    .foot .aud { font-size:32px; font-weight:700; color:#3a3730; }
    .foot .aud b { background:var(--hl); padding:0 8px; border-radius:8px; }
    .foot .page { background:var(--ink); color:#fff; font-weight:700; font-size:28px;
      border-radius:999px; padding:9px 28px; }
  </style>
</head>
<body>
  <section class="poster">
    <div class="content">

      <div class="pills">
        <div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="#111114" stroke-width="2.2" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 7.5 20 19M8.5 16.5 20 5"/></svg>剪藏 + 下载</div>
        <div class="pill y"><svg viewBox="0 0 24 24" fill="#111114"><path d="M13 2 4.5 13.5H11L9.5 22 19 10h-6.5z"/></svg>iOS 快捷指令</div>
        <div class="pill"><svg viewBox="0 0 24 24" fill="#111114"><path d="m12 2.5 2.6 5.9 6.4.6-4.8 4.3 1.4 6.3L12 16.3l-5.6 3.3 1.4-6.3L3 9l6.4-.6z"/></svg>建议收藏</div>
      </div>

      <div class="brand">
        <img src="demo-applogo.png" alt="Clipno">
        <div class="name">Clipno<small>剪藏助手 · 手机版</small></div>
      </div>

      <h1 class="title">刷到就<span class="mark">剪</span>，<br>秒进 Notion</h1>

      <p class="sub">文章、帖子、视频、AI 对话，<b>能剪能下</b></p>

      <div class="phones">
        <div class="phone main">
          <div class="island"></div>
          <div class="screen"><img src="demo-phone-1.png" alt="新剪藏：解析文章并 AI 建议标签"></div>
        </div>
        <div class="phone back">
          <div class="island"></div>
          <div class="screen"><img src="demo-phone-2.png" alt="知识库：剪藏卡片流"></div>
        </div>
        <div class="bubble">
          <div class="b1">小红书 / 抖音 / B站 / 公众号</div>
          <div class="b2">粘个链接<em>就存好了</em></div>
        </div>
      </div>

      <div class="foot">
        <span class="aud">适合 <b>Notion 用户</b> · 稍后读党 · 知识管理</span>
        <span class="page">1/3</span>
      </div>

    </div>
  </section>
</body>
</html>
